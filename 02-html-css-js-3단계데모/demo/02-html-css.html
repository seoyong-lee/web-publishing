<!-- STEP 2: HTML + CSS
     디자인이 적용됩니다. 하지만 버튼은 여전히 눌러도 반응이 없습니다.
     CSS는 '어떻게 보이는지'만 담당하지, '어떻게 동작하는지'는 담당하지 않습니다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEP 2 - HTML + CSS</title>
  <style>
    html {
      font-family: sans-serif;
      background-color: #f7f5f2;
    }
    body {
      max-width: 480px;
      margin: 80px auto;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    p {
      color: #777;
    }
    button {
      padding: 12px 24px;
      background-color: #6c5ce7;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>환영합니다</h1>
  <p>이 버튼을 눌러보세요.</p>
  <button>눌러보세요</button>
</body>
</html>
