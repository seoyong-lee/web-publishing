<!-- 실습용: 박스 3개는 준비되어 있습니다.
     AOS(michalsnik.github.io/aos) 사이트에서 CSS/JS 불러오는 코드를 복사해서
     각각 <head>와 </body> 직전에 붙여넣고, AOS.init()으로 초기화한 뒤
     각 박스에 data-aos="fade-up" 속성을 붙여보세요. -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOS 실습</title>
  <style>
    .box {
      width: 400px;
      height: 200px;
      background-color: #d99f9f;
      color: #fff;
      margin: 24px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
  </style>
  <!-- 여기에 AOS CSS <link> 코드를 붙여넣으세요 -->
</head>
<body>

  <div style="height: 100vh; display: flex; align-items: center; justify-content: center;">
    아래로 스크롤 해보세요 ↓
  </div>

  <div class="box">1</div>
  <div class="box">2</div>
  <div class="box">3</div>

  <!-- 여기에 AOS JS <script> 코드를 붙여넣고, AOS.init(); 을 호출하세요 -->

</body>
</html>
