<!-- 실습 ③: 시맨틱 태그로 자기소개 페이지의 구조를 만듭니다.
     디자인은 신경 쓰지 않습니다. CSS는 오후 실습 ④에서 입힙니다.
     주석 자리에 내 내용을 태그로 채워 보세요.

     nav의 링크는 같은 페이지 안에서 이동하는 링크입니다.
       <a href="#about">소개</a>  →  id="about"가 붙은 곳으로 이동
     # 뒤에 가고 싶은 곳의 id를 적습니다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기소개</title>
</head>
<body>

  <header>
    <!-- 이름(h1)과 한 줄 소개(p) -->
  </header>

  <nav>
    <!-- 링크 3개: 소개 · 프로젝트 · 연락처 -->
  </nav>

  <main>
    <section id="about">
      <!-- 소개 제목(h2)과 문단(p) -->
    </section>

    <section id="projects">
      <!-- 프로젝트 목록(ul · li) -->
    </section>
  </main>

  <footer id="contact">
    <!-- 이메일 -->
  </footer>

</body>
</html>
