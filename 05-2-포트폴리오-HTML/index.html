<!-- 실습 ③-2: ③-1에서 쓴 구조-설계.md를 보면서 주석 자리를 내 내용과 태그로 채웁니다.
     CSS는 아직 쓰지 않습니다. 브라우저로 열어 순서와 제목 계층만 확인하세요.

     · 사진은 이 폴더의 profile.jpg를 내 사진으로 바꿔도 됩니다. (파일 이름을 src와 똑같이)
     · nav의 링크는 같은 페이지 안에서 이동합니다.
         <a href="#about">소개</a>  →  id="about"가 붙은 곳으로 이동 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이름 | 포트폴리오</title>
</head>
<body>

  <header>
    <!-- 프로필 사진(img · alt) · 이름(h1) · 한 줄 소개(p) -->
  </header>

  <nav>
    <!-- 링크 세 개: 소개(#about) · 프로젝트(#projects) · 연락처(#contact) -->
  </nav>

  <main>
    <section id="about">
      <!-- 소제목(h2)과 소개 문단(p) -->
    </section>

    <section id="projects">
      <!-- 소제목(h2) -->
      <ul>
        <li>
          <!-- 프로젝트 이름(h3)과 설명(p) -->
        </li>
        <!-- 프로젝트 수만큼 li를 복사합니다 -->
      </ul>
    </section>
  </main>

  <footer id="contact">
    <!-- 이메일(p) -->
  </footer>

</body>
</html>
